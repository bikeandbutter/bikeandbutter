<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bike & Butter</title>
  <link rel="stylesheet" href="home.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    img {
      -webkit-user-drag: none;
      user-select: none;
      pointer-events: none;
    }
    body { 
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none; 
    }

    /* User chip styles for home page (home.css doesn't include these) */
    .user-chip {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 10px;
      border: 1px solid #e5e5e5;
      border-radius: 999px;
      background: #fff;
      cursor: pointer;
    }
    .user-avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #111;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
    }
    .user-name {
      font-size: 12px;
      font-weight: 500;
      color: #111;
      white-space: nowrap;
    }
    .user-menu {
      position: absolute;
      top: 42px;
      right: 0;
      background: #fff;
      border: 1px solid #eee;
      border-radius: 10px;
      padding: 6px;
      min-width: 120px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      display: none;
      z-index: 200;
    }
    .user-chip.open .user-menu { display: block; }
    .user-menu a {
      display: block;
      font-size: 12px;
      color: #d33;
      padding: 6px 8px;
      border-radius: 6px;
      text-decoration: none;
    }
    .user-menu a:hover { background: #f6f6f6; }

    /* Auth modal for home page */
    .auth-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .auth-modal-overlay.open { display: flex; }
    .auth-modal {
      background: #fff;
      border-radius: 14px;
      width: 360px;
      max-width: 95vw;
      padding: 36px 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.18);
      text-align: center;
    }
    .auth-modal-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 11px 20px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      background: #fff;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      color: #111;
      margin-bottom: 10px;
    }
    .auth-modal-cancel {
      font-size: 12px;
      color: #bbb;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: #111;
      color: #fff;
      font-size: 13px;
      padding: 10px 18px;
      border-radius: 8px;
      opacity: 0;
      pointer-events: none;
      transition: 0.2s;
      z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-logo">
    <a href="home.html" class="logo-link">
      <div class="logo-icon">B</div>
      Bike &amp; Butter
    </a>
  </div>
  <div class="nav-right">
    <div class="nav-links">
      <a href="index.html">Bikes</a>
      <a href="brands.html">Brands</a>
      <a href="community.html">Community</a>
      <a href="feed.html">Feed</a>
      <a href="marketplace.html">Marketplace</a>
      <a href="contact.html">Contact Us</a>
    </div>
    <div id="auth-area">
      <a href="#" class="nav-signin" onclick="signIn(); return false;">Sign In</a>
    </div>
  </div>
</nav>

<!-- HERO -->
<div class="hero">
  <div class="hero-box">
    <div class="hero-title">BIKE & BUTTER</div>
    <div class="hero-sub">The Road Bike Archive</div>
    <div class="hero-meta" id="hero-meta">Loading collection...</div>
    <button class="enter-btn" onclick="window.location.href='index.html'">
      Browse Collection
    </button>
  </div>
</div>

<!-- CANVAS -->
<div class="canvas" id="canvas">
  <div class="grid" id="grid"></div>
</div>

<div class="toast" id="toast"></div>
<script src="auth.js"></script>
<script>
const SHEET_ID = '19fTMhMZsNgd-F9RazoKFQ15aGEOUEhrhFpnhDB6cgs0';
const API_KEY  = 'AIzaSyCsMCVvRAh2D2N-U2wuiYMVyE9Ah8qtGY8';
const RANGE    = 'Database!B2:W';

const canvas = document.getElementById('canvas');
const grid   = document.getElementById('grid');

let offsetX = 0;
let offsetY = 0;

document.addEventListener('selectstart', (e) => {
  if (isDragging) e.preventDefault();
});

function centerCanvas() {
  requestAnimationFrame(() => {
    const rect = grid.getBoundingClientRect();
    offsetX = (window.innerWidth  - rect.width)  / 2;
    offsetY = (window.innerHeight - rect.height) / 2;
    canvas.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
  });
}

window.addEventListener('resize', centerCanvas);

async function loadHomeCards() {
  const url  = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${RANGE}?key=${API_KEY}`;
  const res  = await fetch(url);
  const data = await res.json();
  const rows = data.values || [];
  const headers  = rows[0].map(h => h.trim());
  const dataRows = rows.slice(1);

  const bikes = dataRows.map(row => {
    const bike = {};
    headers.forEach((h, i) => bike[h] = row[i] || '');
    return bike;
  });

  document.getElementById('hero-meta').textContent =
    `${new Set(bikes.map(b => b['Brand'])).size} brands · ${bikes.length} bikes`;

  const repeated = Array(6).fill(bikes).flat();
  grid.innerHTML  = repeated.map(buildCard).join('');

  setTimeout(centerCanvas, 60);
}

function buildCard(bike) {
  const id    = bike['ID']     || '';
  const name  = bike['Name']   || 'Unnamed';
  const brand = bike['Brand']  || '';
  const photo = bike['Photo_1']|| '';
  const imgSrc = photo || `https://placehold.co/220x140?text=${brand}`;
  return `
    <div class="card" data-id="${id}">
      <img src="${imgSrc}" loading="lazy" />
      <div class="card-title">${name}</div>
    </div>`;
}

loadHomeCards();

/* ── DRAG ── */
let isDragging = false;
let startX = 0, startY = 0, moved = false;

document.addEventListener('pointerdown', (e) => {
  isDragging = true;
  moved      = false;
  startX     = e.clientX - offsetX;
  startY     = e.clientY - offsetY;
  document.body.style.cursor = 'grabbing';
});

document.addEventListener('pointerup', () => {
  isDragging = false;
  document.body.style.cursor = 'grab';
});

document.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - startX;
  const dy = e.clientY - startY;
  if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
  offsetX = dx;
  offsetY = dy;
  canvas.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
});

document.addEventListener('click', (e) => {
  const card = e.target.closest('.card');
  if (!card) return;
  if (moved) { e.preventDefault(); e.stopPropagation(); return; }
  const id = card.getAttribute('data-id');
  if (id) window.location.href = `bike.html?id=${id}`;
});
</script>

</body>
</html>
