  <style>
    .profile-shell {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 20px 80px;
    }

    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 36px 0 24px;
      border-bottom: 1px solid #eee;
      text-align: center;
    }

    .profile-avatar {
      width: 72px; height: 72px;
      border-radius: 50%; object-fit: cover; flex-shrink: 0;
      display: block;
    }

    .profile-avatar-fallback {
      width: 72px; height: 72px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; font-weight: 700; color: #fff; flex-shrink: 0;
    }

    .profile-name-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .profile-handle {
      font-size: 1rem;
      font-weight: 600;
      color: #111;
      margin: 0;
    }

    .own-profile-tag {
      display: inline-flex; align-items: center;
      font-size: 0.65rem; font-weight: 700; letter-spacing: .06em;
      text-transform: uppercase; background: #111; color: #fff;
      padding: 2px 8px; border-radius: 99px;
    }

    /* Stats — ciggies-style: smaller, with a divider line */
    .profile-stats {
      display: flex;
      gap: 0;
      margin-top: 4px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 22px;
      position: relative;
    }

    .stat-item + .stat-item::before {
      content: '';
      position: absolute;
      left: 0; top: 20%; bottom: 20%;
      width: 1px;
      background: #ddd;
    }

    .stat-num {
      display: block;
      font-size: 1rem;
      font-weight: 700;
      color: #111;
      line-height: 1;
    }

    .stat-label {
      display: block;
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #bbb;
      margin-top: 4px;
    }

    /* Tabs */
    .profile-tabs {
      display: flex;
      padding: 16px 0 0;
      border-bottom: 1px solid #eee;
    }

    .tab-btn {
      padding: 8px 16px;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: .02em;
      color: #aaa;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all .15s;
      margin-bottom: -1px;
    }

    .tab-btn:hover { color: #333; }
    .tab-btn.active { color: #111; border-bottom-color: #111; }

    /* Grid */
    .profile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 14px;
      padding: 20px 0 0;
    }

    .profile-bike-card {
      display: block;
      text-decoration: none;
      border: 1px solid #eee;
      border-radius: 10px;
      overflow: hidden;
      transition: border-color .15s, box-shadow .15s, transform .15s;
      background: #fff;
    }

    .profile-bike-card:hover {
      border-color: #ccc;
      box-shadow: 0 4px 16px rgba(0,0,0,.07);
      transform: translateY(-2px);
    }

    /* Fixed-ratio image wrapper so images never overflow */
    .profile-bike-img-wrap {
      width: 100%;
      aspect-ratio: 4/3;
      overflow: hidden;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .profile-bike-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .profile-bike-img-placeholder {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #f5f5f5 0%, #ebebeb 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }

    .profile-bike-info { padding: 10px 12px 12px; }

    .profile-bike-brand {
      font-size: 0.68rem;
      font-weight: 400;          /* unbold */
      letter-spacing: .04em;
      text-transform: uppercase;
      color: #aaa;
      margin: 0 0 2px;
    }

    .profile-bike-name {
      font-size: 0.82rem;
      font-weight: 600;
      color: #111;
      margin: 0 0 3px;
      line-height: 1.3;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-clamp: 2;
    }

    .profile-bike-meta {
      font-size: 0.7rem;
      color: #bbb;
      margin: 0;
    }

    .empty-state {
      padding: 48px 0;
      text-align: center;
      color: #bbb;
      font-size: 0.875rem;
    }

    .empty-icon { font-size: 2rem; margin-bottom: 8px; display: block; }

    .not-found { padding: 80px 20px; text-align: center; }
    .not-found h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; }
    .not-found p { color: #999; font-size: 0.875rem; }
  </style>

<main>
  <div class="profile-shell" id="profile-shell">
    <div class="empty-state" style="padding-top:80px;">Loading profile…</div>
  </div>
</main>

<div class="toast" id="toast"></div>
<script src="auth.js"></script>
<script>
const SHEET_ID = '19fTMhMZsNgd-F9RazoKFQ15aGEOUEhrhFpnhDB6cgs0';
const API_KEY  = 'AIzaSyCsMCVvRAh2D2N-U2wuiYMVyE9Ah8qtGY8';

const params    = new URLSearchParams(location.search);
const targetUid = params.get('uid') || '';

let profileData = null;
let userActions = [];
let bikeMap     = {};

document.addEventListener('DOMContentLoaded', init);
window.addEventListener('bb-auth-change', () => { if (profileData) renderProfile(); });

async function init() {
  if (!targetUid) { renderNotFound('No user specified.'); return; }
  await Promise.all([loadUserFeed(), loadBikeMeta()]);
  if (!profileData) { renderNotFound('User not found.'); return; }
  renderProfile();
}

async function loadUserFeed() {
  try {
    const res  = await fetch(`${APPS_SCRIPT_URL}?action=getFeed&uid=${encodeURIComponent(targetUid)}&limit=500`);
    const text = await res.text();
    userActions = JSON.parse(text);
    if (userActions.length) {
      const e = userActions[0];
      // Support both photoURL (old) and userPhoto (new field name from Apps Script)
      profileData = {
        userId:   e.userId,
        userName: e.userName,
        photoURL: e.photoURL || e.userPhoto || null
      };
    }
  } catch(err) { console.error('Profile feed load failed:', err); userActions = []; }
}

async function loadBikeMeta() {
  try {
    const url  = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/Database!B2:Z?key=${API_KEY}`;
    const res  = await fetch(url);
    const data = await res.json();
    const rows = data.values || [];
    const hdrs = rows[0];
    const idIdx       = hdrs.indexOf('ID');
    const brandIdx    = hdrs.indexOf('Brand');
    const imgIdx      = hdrs.indexOf('Photo_1');
    const categoryIdx = hdrs.indexOf('Category');
    const yearIdx     = hdrs.indexOf('Year');
    rows.slice(1).forEach(r => {
      if (r[idIdx]) {
        bikeMap[String(r[idIdx])] = {
          brand:    r[brandIdx]    || '',
          image:    r[imgIdx]      || '',
          category: r[categoryIdx] || '',
          year:     r[yearIdx]     || '',
        };
      }
    });
  } catch(err) { console.warn('Bike meta load failed:', err); }
}

function renderProfile() {
  const shell       = document.getElementById('profile-shell');
  const favItems    = dedupe(userActions.filter(e => e.action === 'fav'));
  const riddenItems = dedupe(userActions.filter(e => e.action === 'ridden'));
  const wishItems   = dedupe(userActions.filter(e => e.action === 'wishlist'));
  const isOwn       = window.currentUser && window.currentUser.uid === targetUid;

  // Avatar: prefer photoURL from feed data, fall back to currentUser picture if it's your own profile
  let avatarSrc = profileData.photoURL;
  if (!avatarSrc && isOwn && window.currentUser?.picture) {
    avatarSrc = window.currentUser.picture;
  }

  const avatarHTML = avatarSrc
    ? `<img class="profile-avatar" src="${avatarSrc}" alt="${sanitize(profileData.userName)}" referrerpolicy="no-referrer" crossorigin="anonymous">`
    : `<div class="profile-avatar-fallback" style="background:#555">${sanitize(profileData.userName.slice(0,2).toUpperCase())}</div>`;

  // Show @handle only (drop the display name row entirely)
  const handleStr = '@' + handle(profileData.userName);

  shell.innerHTML = `
    <div class="profile-header">
      ${avatarHTML}
      <div class="profile-name-row">
        <p class="profile-handle">${sanitize(handleStr)}</p>
        ${isOwn ? '<span class="own-profile-tag">You</span>' : ''}
      </div>
      <div class="profile-stats">
        <div class="stat-item">
          <span class="stat-num">${favItems.length}</span>
          <span class="stat-label">Favourites</span>
        </div>
        <div class="stat-item">
          <span class="stat-num">${riddenItems.length}</span>
          <span class="stat-label">Ridden</span>
        </div>
        <div class="stat-item">
          <span class="stat-num">${wishItems.length}</span>
          <span class="stat-label">Wishlist</span>
        </div>
      </div>
    </div>

    <div class="profile-tabs">
      <button class="tab-btn active" onclick="switchTab('fav', this)">Favourites</button>
      <button class="tab-btn" onclick="switchTab('ridden', this)">Ridden</button>
      <button class="tab-btn" onclick="switchTab('wishlist', this)">Wishlist</button>
    </div>

    <div class="profile-grid" id="profile-grid"></div>
  `;

  renderGrid('fav', favItems);
}

function switchTab(tab, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const map = {
    fav:      dedupe(userActions.filter(e => e.action === 'fav')),
    ridden:   dedupe(userActions.filter(e => e.action === 'ridden')),
    wishlist: dedupe(userActions.filter(e => e.action === 'wishlist')),
  };
  renderGrid(tab, map[tab]);
}

function renderGrid(tab, entries) {
  const grid = document.getElementById('profile-grid');
  if (!grid) return;
  if (!entries.length) {
    const msgs = {
      fav:      { icon: '★', text: 'No favourited bikes yet.' },
      ridden:   { icon: '☑', text: 'No bikes marked as ridden yet.' },
      wishlist: { icon: '♡', text: 'No bikes on the wishlist yet.' },
    };
    const m = msgs[tab];
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><span class="empty-icon">${m.icon}</span>${m.text}</div>`;
    return;
  }
  grid.innerHTML = entries.map(entry => {
    const meta    = bikeMap[entry.bikeId] || {};

    const imgHTML = meta.image
      ? `<img class="profile-bike-img" src="${meta.image}" alt="${sanitize(entry.bikeName)}" loading="lazy">`
      : `<div class="profile-bike-img-placeholder">🚲</div>`;

    // Build category + year meta line
    const metaParts = [meta.category, meta.year].filter(Boolean);
    const metaLine  = metaParts.length
      ? `<p class="profile-bike-meta">${sanitize(metaParts.join(' · '))}</p>`
      : '';

    return `
      <a href="bike.html?id=${entry.bikeId}" class="profile-bike-card">
        <div class="profile-bike-img-wrap">${imgHTML}</div>
        <div class="profile-bike-info">
          <p class="profile-bike-brand">${sanitize(meta.brand)}</p>
          <p class="profile-bike-name">${sanitize(entry.bikeName)}</p>
          ${metaLine}
        </div>
      </a>`;
  }).join('');
}

function dedupe(entries) {
  const seen = new Map();
  [...entries].forEach(e => { if (!seen.has(e.bikeId)) seen.set(e.bikeId, e); });
  return [...seen.values()];
}

// Converts display name → handle (keep alphanumeric + common chars, lowercase)
function handle(name) {
  return String(name || '')
    .toLowerCase()
    .replace(/\s+/g, '')
    .replace(/[^a-z0-9._&]/g, '');
}

function sanitize(str) { return String(str || '').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function renderNotFound(msg) {
  document.getElementById('profile-shell').innerHTML = `
    <div class="not-found">
      <h2>Profile not found</h2>
      <p>${msg}</p>
      <a href="feed.html" style="font-size:.875rem;color:#111;font-weight:600;">← Back to Feed</a>
    </div>`;
}
</script>
