function log(msg) { document.getElementById("log").textContent += msg + "\n"; }

async function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { alert(error.message); return; }
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("actionBox").style.display = "block";
}

(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session) {
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("actionBox").style.display = "block";
  }
})();

async function runImport() {
  document.getElementById("importBtn").disabled = true;
  let imported = 0, skipped = 0, failed = 0;
  for (const inv of invoices) {
    const fullNo = inv.fullInvNo;
    const { data: existing } = await sb.from("invoices").select("id").eq("full_invoice_no", fullNo).limit(1);
    if (existing && existing.length) { log("SKIP (already imported): " + fullNo); skipped++; continue; }

    const invoiceDiscounts = (inv.invDiscs || []).map(d => ({ label: d.label, type: d.type, value: d.value }));
    const payload = {
      invoice_no: inv.invoiceNo,
      saved_invoice_no: inv.savedInvoiceNo || inv.invoiceNo,
      rev_suffix: inv.revSuffix || null,
      is_revision: !!inv.isRevision,
      full_invoice_no: fullNo,
      customer_name: inv.customerName,
      invoice_date: inv.rawDate,
      address_line1: inv.addr1 || null,
      address_line2: inv.addr2 || null,
      postal_code: inv.postal || null,
      remarks: inv.remarks || null,
      invoice_discounts: invoiceDiscounts,
      subtotal: inv.grandTotal, tax: 0, total: inv.grandTotal,
      status: "sent"
    };
    const { data: created, error } = await sb.from("invoices").insert(payload).select("id").single();
    if (error) { log("FAILED: " + fullNo + " -- " + error.message); failed++; continue; }

    const itemRows = (inv.items || []).map((it, i) => ({
      invoice_id: created.id,
      description: it.desc,
      qty: it.qty,
      unit_price: it.price,
      sort_order: i,
      subs: (it.subs || []).map(s => ({ text: s.text })),
      discounts: (it.discs || []).map(d => ({ label: d.label, type: d.type, value: d.value }))
    }));
    if (itemRows.length) {
      const { error: itemErr } = await sb.from("invoice_items").insert(itemRows);
      if (itemErr) { log("ITEMS FAILED: " + fullNo + " -- " + itemErr.message); failed++; continue; }
    }
    log("OK: " + fullNo + " (" + inv.customerName + ", $" + inv.grandTotal + ")");
    imported++;
  }
  log("\n---\nDone. Imported " + imported + ", skipped " + skipped + ", failed " + failed + ".");
  document.getElementById("importBtn").disabled = false;
}
</script>
</body></html>
