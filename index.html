<script>
const SHEET_ID = '19fTMhMZsNgd-F9RazoKFQ15aGEOUEhrhFpnhDB6cgs0';
const API_KEY  = 'AIzaSyCsMCVvRAh2D2N-U2wuiYMVyE9Ah8qtGY8';

// REMOVED: canvas plane + grid refs (scroller deleted)

async function loadCounts() {
  try {
    const [bikeRes, brandRes] = await Promise.all([
      fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/Database!B2:B?key=${API_KEY}`),
      fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/Brands!B2:B?key=${API_KEY}`)
    ]);
    const bikeData  = await bikeRes.json();
    const brandData = await brandRes.json();
    const bikeCount  = ((bikeData.values  || []).slice(1)).filter(r => r[0]).length;
    const brandCount = ((brandData.values || []).slice(1)).filter(r => r[0]).length;
    document.getElementById('hero-meta').textContent = `${brandCount} brands · ${bikeCount} bikes`;
  } catch (e) {
    document.getElementById('hero-meta').textContent = '';
  }
}

loadCounts();
</script>
