    img {

    body {
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
      overflow: hidden; /* no scrollbars, canvas fills viewport */

    /* ── Infinite canvas ── */
    .canvas-viewport {

      inset: 0;
      overflow: hidden;
      z-index: 0;

    /* The inner plane that moves — much larger than viewport */
    #canvas-plane {

      cursor: pointer;

      transform: translateY(-2px);

      aspect-ratio: 3/2;
      object-fit: cover;
      display: block;
      /* Sharp rendering — avoids browser upscale blur */

      transform: translateZ(0); /* force GPU layer for sharper composite */

<!-- INFINITE CANVAS -->
<div class="canvas-viewport" id="canvas-viewport">

    <div id="grid"></div>

<script>
const SHEET_ID = '19fTMhMZsNgd-F9RazoKFQ15aGEOUEhrhFpnhDB6cgs0';
const API_KEY  = 'AIzaSyCsMCVvRAh2D2N-U2wuiYMVyE9Ah8qtGY8';

const plane = document.getElementById('canvas-plane');
const grid  = document.getElementById('grid');

// ── Card dimensions (must match CSS) ──────────────────────────────
const CARD_W   = 200;
const CARD_H   = 153; // 133px image (3:2 of 200) + 4+8+8px title area
const GAP      = 12;
const CELL     = CARD_W + GAP;  // 212
const CELL_H   = CARD_H + GAP;  // 165

// ── Device detect ─────────────────────────────────────────────────
const isMobile = window.innerWidth <= 768;

// ── Desktop grid constants (unchanged) ────────────────────────────
const GRID_COLS = 60;
const GRID_ROWS = 60;

let bikes  = [];
let planeW = 0;
let planeH = 0;
let tx = 0, ty = 0;

// ── Load data ─────────────────────────────────────────────────────
async function loadData() {
  const [bikeRes, brandRes] = await Promise.all([
    fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/Database!B2:W?key=${API_KEY}`),
    fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/Brands!B2:F?key=${API_KEY}`)
  ]);

  const bikeData  = await bikeRes.json();
  const brandData = await brandRes.json();

  const rows    = bikeData.values || [];
  const headers = rows[0].map(h => h.trim());
  const dataRows = rows.slice(1);

  bikes = dataRows.map(row => {
    const bike = {};
    headers.forEach((h, i) => bike[h] = row[i] || '');
    return bike;
  });

  const brandRows  = brandData.values || [];
  const brandCount = brandRows.filter(r => r[0] && r[0].trim()).length;

  document.getElementById('hero-meta').textContent =
    `${brandCount} brands · ${bikes.length} bikes`;

  if (isMobile) {
    // Mobile: no canvas, no image loading — hero splash only
    document.getElementById('canvas-viewport').style.display = 'none';
  } else {
    buildGrid();
  }
}

// ══════════════════════════════════════════════════════════════════
//  DESKTOP — original fixed grid (completely unchanged)
// ══════════════════════════════════════════════════════════════════
function buildGrid() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const totalCells = GRID_COLS * GRID_ROWS;
  const tiled = [];
  while (tiled.length < totalCells) tiled.push(...bikes);
  const cells = tiled.slice(0, totalCells);
  grid.style.gridTemplateColumns = `repeat(${GRID_COLS}, ${CARD_W}px)`;
  grid.innerHTML = cells.map(buildCard).join('');
  planeW = GRID_COLS * CELL + GAP;
  planeH = GRID_ROWS * CELL_H + GAP;
  tx = (vw - planeW) / 2;
  ty = (vh - planeH) / 2;
  applyTransform();
}

function buildCard(bike) {
  const id    = bike['ID']      || '';
  const name  = bike['Name']    || 'Unnamed';
  const brand = bike['Brand']   || '';
  const photo = bike['Photo_1'] || '';
  const imgSrc = photo || `https://placehold.co/400x267?text=${encodeURIComponent(brand)}`;
  return `<div class="card" data-id="${id}">
    <img src="${imgSrc}" loading="lazy" decoding="async" />
    <div class="card-title">${name}</div>
  </div>`;
}

// ── Transform (shared) ────────────────────────────────────────────
function applyTransform() {
  plane.style.transform = `translate3d(${Math.round(tx)}px, ${Math.round(ty)}px, 0)`;
}

function clamp() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  tx = Math.min(0, Math.max(vw - planeW, tx));
  ty = Math.min(0, Math.max(vh - planeH, ty));
}

// ══════════════════════════════════════════════════════════════════
//  MOBILE — virtual canvas
//  Only ~30 real DOM nodes exist at any time. As you drag, cards
//  that leave the viewport get recycled onto newly-visible cells
//  with a fresh image. The browser never holds more than ~30 images
//  in memory, so load is near-instant and scrolling stays smooth.
// ══════════════════════════════════════════════════════════════════
const VCOLS   = 30;   // logical world columns
const VROWS   = 30;   // logical world rows
const BUFFER  = 1;    // cells to pre-render just outside viewport

function initVirtualCanvas() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;

  planeW = VCOLS * CELL + GAP;
  planeH = VROWS * CELL_H + GAP;

  // Start near centre of world
  tx = (vw - planeW) / 2;
  ty = (vh - planeH) / 2;

  // Switch grid to absolute-position mode
  grid.style.gridTemplateColumns = '';
  grid.style.position = 'relative';
  grid.style.width    = planeW + 'px';
  grid.style.height   = planeH + 'px';
  grid.innerHTML = '';

  // Build the DOM pool — only as many cards as can fit on screen + buffer
  const colsVisible = Math.ceil(vw / CELL) + BUFFER * 2 + 1;
  const rowsVisible = Math.ceil(vh / CELL_H) + BUFFER * 2 + 1;
  const poolSize    = colsVisible * rowsVisible;

  for (let i = 0; i < poolSize; i++) {
    const el = document.createElement('div');
    el.className = 'card';
    el.style.cssText = `position:absolute;width:${CARD_W}px`;
    el.innerHTML = `<img decoding="async" style="width:100%;aspect-ratio:3/2;object-fit:cover;display:block;border-radius:8px 8px 0 0">
      <div class="card-title"></div>`;
    el.dataset.assignedCol = '-999';
    el.dataset.assignedRow = '-999';
    grid.appendChild(el);
  }

  applyTransform();
  renderVisibleCells();
}

// Stable bike assignment per cell — same cell always shows same bike
const cellBikeIndex = {};
function bikeForCell(col, row) {
  const key = col + ',' + row;
  if (cellBikeIndex[key] === undefined) {
    cellBikeIndex[key] = ((col * 37 + row * 17 + col * row) % bikes.length + bikes.length) % bikes.length;
  }
  return bikes[cellBikeIndex[key]];
}

function renderVisibleCells() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;

  const colStart = Math.max(0, Math.floor(-tx / CELL) - BUFFER);
  const colEnd   = Math.min(VCOLS - 1, Math.ceil((-tx + vw) / CELL) + BUFFER);
  const rowStart = Math.max(0, Math.floor(-ty / CELL_H) - BUFFER);
  const rowEnd   = Math.min(VROWS - 1, Math.ceil((-ty + vh) / CELL_H) + BUFFER);

  // Build set of cells that should be visible
  const needed = new Set();
  for (let c = colStart; c <= colEnd; c++)
    for (let r = rowStart; r <= rowEnd; r++)
      needed.add(c + ',' + r);

  const pool = Array.from(grid.children);

  // Mark cards already showing the right cell
  const usedKeys = new Set();
  for (const el of pool) {
    const key = el.dataset.assignedCol + ',' + el.dataset.assignedRow;
    if (needed.has(key)) usedKeys.add(key);
  }

  // Collect free cards (off-screen, available for recycling)
  const free = pool.filter(el => !needed.has(el.dataset.assignedCol + ',' + el.dataset.assignedRow));
  let fi = 0;

  for (const key of needed) {
    if (usedKeys.has(key)) continue;  // already rendered
    const el = free[fi++];
    if (!el) continue;

    const [c, r] = key.split(',').map(Number);
    const bike   = bikeForCell(c, r);
    const x = c * CELL + GAP;
    const y = r * CELL_H + GAP;

    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    el.dataset.assignedCol = c;
    el.dataset.assignedRow = r;
    el.dataset.id = bike['ID'] || '';

    const img    = el.querySelector('img');
    const newSrc = bike['Photo_1'] || `https://placehold.co/400x267?text=${encodeURIComponent(bike['Brand'] || '')}`;
    if (img.src !== newSrc) img.src = newSrc;
    el.querySelector('.card-title').textContent = bike['Name'] || '';
  }
}

// ── Shared drag + momentum ────────────────────────────────────────
let isDragging = false;
let lastX = 0, lastY = 0;
let dragStartX = 0, dragStartY = 0;
let hasMoved = false;
const DRAG_THRESHOLD = 4;

let velX = 0, velY = 0;
let lastMoveTime = 0;
let momentumRAF = null;

function cancelMomentum() {
  if (momentumRAF) { cancelAnimationFrame(momentumRAF); momentumRAF = null; }
}

function runMomentum() {
  if (Math.abs(velX) < 0.5 && Math.abs(velY) < 0.5) return;
  tx += velX; ty += velY;
  velX *= 0.93; velY *= 0.93;
  clamp();
  applyTransform();
  if (isMobile) renderVisibleCells();
  momentumRAF = requestAnimationFrame(runMomentum);
}

document.addEventListener('selectstart', e => { if (isDragging) e.preventDefault(); });

document.addEventListener('pointerdown', e => {
  cancelMomentum();
  isDragging = true; hasMoved = false;
  lastX = e.clientX; lastY = e.clientY;
  dragStartX = e.clientX; dragStartY = e.clientY;
  velX = 0; velY = 0;
  lastMoveTime = Date.now();
  document.body.style.cursor = 'grabbing';
});

document.addEventListener('pointerup', () => {
  isDragging = false;
  document.body.style.cursor = 'grab';
  if (isMobile && (Math.abs(velX) > 1 || Math.abs(velY) > 1))
    momentumRAF = requestAnimationFrame(runMomentum);
});

document.addEventListener('pointermove', e => {
  if (!isDragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;

  if (Math.abs(e.clientX - dragStartX) > DRAG_THRESHOLD ||
      Math.abs(e.clientY - dragStartY) > DRAG_THRESHOLD) hasMoved = true;

  const now = Date.now();
  const dt  = Math.max(1, now - lastMoveTime);
  velX = dx / dt * 16;
  velY = dy / dt * 16;
  lastMoveTime = now;

  lastX = e.clientX; lastY = e.clientY;
  tx += dx; ty += dy;
  clamp();
  applyTransform();
  if (isMobile) renderVisibleCells();
});

// Click only fires if user didn't drag
document.addEventListener('click', e => {
  if (hasMoved) { e.preventDefault(); e.stopPropagation(); return; }
  const card = e.target.closest('.card');
  if (!card) return;
  const id = card.getAttribute('data-id');
  if (id) window.location.href = `bike.html?id=${id}`;
});

// Re-build on resize
window.addEventListener('resize', buildGrid);

// ── Boot ──────────────────────────────────────────────────────────
loadData();
</script>
