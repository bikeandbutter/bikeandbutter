<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Order Confirmation — EVR × Bike and Butter</title>
<link rel="icon" type="image/png" sizes="32x32" href="photos/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="photos/favicon-16.png" />
<link rel="apple-touch-icon" href="photos/apple-touch-icon.png" />
<link rel="stylesheet" href="EVR.css?v=3" />
<style>
  .confirm-wrap{min-height:calc(100vh - 74px);display:flex;align-items:center;justify-content:center;padding:40px 24px;background:var(--bg);}
  .confirm-box{max-width:460px;width:100%;padding:48px 40px;text-align:center;background:var(--bg-2);border:1px solid var(--border-mid);border-radius:8px;}
  .confirm-icon{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 22px;font-size:22px;font-weight:700;border:1.5px solid;}
  .confirm-icon.success{background:rgba(102,187,106,0.10);color:#4c9a52;border-color:rgba(76,154,82,0.3);}
  .confirm-icon.pending{background:var(--orange-dim);color:var(--orange);border-color:var(--orange-glow);}
  .confirm-icon.failed{background:rgba(239,83,80,0.08);color:#d64545;border-color:rgba(214,69,69,0.3);}
  .confirm-title{font-family:var(--font-display);font-size:24px;font-weight:600;letter-spacing:-0.3px;margin-bottom:12px;color:var(--white);}
  .confirm-desc{color:var(--white-dim);font-size:14px;line-height:1.7;margin-bottom:28px;font-weight:400;}
  .confirm-ref{font-family:var(--font-mono);background:var(--bg-3);border:1px solid var(--border);padding:11px 18px;border-radius:4px;font-size:13px;display:inline-block;margin-bottom:28px;color:var(--white);letter-spacing:0.5px;}
  .confirm-back{color:var(--orange);text-decoration:none;font-size:13px;font-weight:600;font-family:var(--font-mono);letter-spacing:0.5px;text-transform:uppercase;}
  .confirm-back:hover{opacity:0.75;}
</style>
</head>
<body>

  <nav class="rs-nav">
    <div class="nav-left-group">
      <div class="nav-left-icons">
        <a class="nav-icon-btn" href="./" aria-label="Home">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M3 9l7-6 7 6v8a1 1 0 0 1-1 1h-4v-6H8v6H4a1 1 0 0 1-1-1V9z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        </a>
      </div>
      <div class="nav-logo">
        <div class="logo-link">
          <a href="../"><img src="photos/bikeandbutter_logo.png" alt="Bike and Butter" class="nav-logo-img nav-logo-img-bb"/></a>
          <span class="logo-x">×</span>
          <a href="./"><img src="photos/evr_logo.png" alt="EVR" class="nav-logo-img nav-logo-img-evr"/></a>
        </div>
      </div>
    </div>
  </nav>

  <div class="confirm-wrap">
    <div class="confirm-box">
      <div id="status-icon" class="confirm-icon pending">···</div>
      <h1 id="status-title" class="confirm-title">Checking your order…</h1>
      <p id="status-desc" class="confirm-desc">One moment while we confirm your payment status.</p>
      <div class="confirm-ref" id="order-ref" style="display:none"></div>
      <br/>
      <a href="/evr/" class="confirm-back">Back to EVR shop</a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const orderNumber = params.get('order');
    const status = params.get('status'); // HitPay appends this: e.g. "completed", "failed"

    if (orderNumber) {
      document.getElementById('order-ref').textContent = orderNumber;
      document.getElementById('order-ref').style.display = 'inline-block';
    }

    const iconEl = document.getElementById('status-icon');
    const titleEl = document.getElementById('status-title');
    const descEl = document.getElementById('status-desc');

    if (status === 'completed') {
      iconEl.className = 'confirm-icon success';
      iconEl.innerHTML = '<svg width="22" height="22" viewBox="0 0 20 20" fill="none"><path d="M4 10.5l4 4 8-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      titleEl.textContent = 'Payment received';
      descEl.textContent = "Thank you for your order! We've received your payment and will be in touch shortly to confirm shipment details.";
    } else if (status === 'failed' || status === 'cancelled') {
      iconEl.className = 'confirm-icon failed';
      iconEl.innerHTML = '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
      titleEl.textContent = 'Payment not completed';
      descEl.textContent = "It looks like the payment didn't go through. Your order is saved, but not yet confirmed — you can try paying again or contact us for help.";
    } else {
      iconEl.className = 'confirm-icon pending';
      iconEl.innerHTML = '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.6"/><path d="M10 6v4l2.5 2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
      titleEl.textContent = 'Order received';
      descEl.textContent = "We're confirming your payment status now. You'll receive an email confirmation shortly once it's processed.";
    }
  </script>
</body>
</html>
