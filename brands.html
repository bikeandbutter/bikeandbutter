    <div class="loading-state">Loading brands...</div>
  </div>
</main>

<div class="toast" id="toast"></div>
<script src="auth.js"></script>
<script>
const SHEET_ID = '19fTMhMZsNgd-F9RazoKFQ15aGEOUEhrhFpnhDB6cgs0';
const API_KEY  = 'AIzaSyCsMCVvRAh2D2N-U2wuiYMVyE9Ah8qtGY8';
const RANGE    = 'Brands!A2:F';

let allBrands = [];

async function fetchBrands() {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${RANGE}?key=${API_KEY}`;
  try {
    const res  = await fetch(url);
    const data = await res.json();
    const rows = data.values || [];
    if (!rows.length) { showError("No brands found"); return; }
    const headers = rows[0].map(h => h.trim());
    allBrands = rows.slice(1).map(row => {
      const obj = {};
      headers.forEach((h, i) => { obj[h] = row[i] || ''; });
      return obj;
    });
    updateGrid();
    document.getElementById('header-tagline').textContent = 'From heritage manufacturers to modern disruptors — explore the brands shaping cycling today.';
  } catch (err) { console.error(err); showError("Failed to load brands"); }
}

function buildCard(brand) {
  const img = brand.Logo
    ? `<img src="${brand.Logo}" alt="${brand.Brand}" loading="lazy">`
    : `<img src="https://placehold.co/200x120?text=No+Logo">`;
  return `
    <a href="solobrand.html?id=${brand.ID}" class="bike-card">
      <div class="bike-img">${img}</div>
      <div class="bike-info">
        <p class="bike-brand">${brand.Country}</p>
        <p class="bike-name">${brand.Brand}</p>
      </div>
    </a>`;
}

function buildCountrySection(country, brands) {
  return `
    <div class="country-section">
      <div class="country-header">
        <span class="country-badge">${country}</span>
        <span class="country-count">${brands.length}</span>
      </div>
      <div class="country-grid">${brands.map(buildCard).join('')}</div>
    </div>`;
}

function updateGrid() {
  const search   = document.getElementById('search-bar').value.toLowerCase().trim();
  let filtered   = allBrands.filter(b =>
    !search ||
    (b.Brand || '').toLowerCase().includes(search) ||
    (b.Country || '').toLowerCase().includes(search)
  );
  const grouped  = {};
  filtered.forEach(b => {
    const key = b.Country || 'Unknown';
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(b);
  });
  document.getElementById('brand-grid').innerHTML = Object.keys(grouped).sort()
    .map(country => buildCountrySection(country, grouped[country])).join('');
}

function showError(msg) {
  document.getElementById('brand-grid').innerHTML = `<div class="loading-state">${msg}</div>`;
}

document.getElementById('search-bar').addEventListener('input', updateGrid);
fetchBrands();
</script>
